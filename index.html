<title>Ingredient → grams (with item-count tab)</title>
<style>
  /* Embed-optimized: snug layout, Notion-friendly */
  *,*::before,*::after{box-sizing:border-box}

  }

  .subtitle{margin:6px 0 8px;color:#94a3b8;font-size:16px}

  .card{background:linear-gradient(180deg,#0b1325 0,#111827 60%);
    border:1px solid rgba(255,255,255,.06);border-radius:18px;
    box-shadow:0 4px 10px rgba(0,0,0,.35);padding:16px;width:100%;
    text-align:center}

  /* Tabs */
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  .tab-btn{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(2,6,23,.6);
    color:#e5e7eb;
    padding:8px 12px;border-radius:12px;cursor:pointer;font-weight:600;
  }
  .tab-btn[aria-selected="true"]{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.25) inset}
  .panel{display:none}
  .panel.active{display:block}

  .grid{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}}
  label{font-size:12px;color:#94a3b8;display:block;margin:0 0 4px;text-align:left}
  input,select,button{
    font:inherit;color:#e5e7eb;background:rgba(2,6,23,.6);
    border:1px solid rgba(255,255,255,.08);outline:0;border-radius:12px;
    padding:10px;width:100%;text-align:center
  }
  input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.25)}
  .controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .btn{cursor:pointer;font-weight:700;padding:10px 14px}

  .sug .item:hover,.sug .item.active{background:rgba(255,255,255,.06)}

  <div class="wrap">

        <button class="tab-btn" role="tab" id="tab-item" aria-controls="panel-item" aria-selected="false">By Item Count</button>
      </div>

      <!-- Panel 1: Ingredient + amount + unit -> grams -->

          </div>

          </div>
          <div>

            </select>
          </div>
        </div>
        <div class="controls">

          <button class="btn" id="convertBtn">Convert</button>

        </div>
        <div class="result">
          <div class="mono" id="out" style="font-size:clamp(22px,3vw,28px);font-weight:800">—</div>
          <div class="muted" id="notes">Enter ingredient, amount, and unit to see result.</div>
        </div>
      </section>

      <!-- Panel 2: Item + quantity -> grams -->
      <section id="panel-item" class="panel" role="tabpanel" aria-labelledby="tab-item" hidden>
        <div class="grid" aria-label="item converter">
          <div class="field">
            <label for="itemIng">Item</label>

          </div>
          <div>
            <label for="qty">Quantity</label>
            <input id="qty" inputmode="decimal" placeholder="e.g. 2 or 0.5"/>
          </div>
          <div>
            <label for="unitG">Result</label>
            <input id="unitG" value="grams" disabled>
          </div>
        </div>
        <div class="controls">
          <div class="muted">Average weight per item</div>
          <button class="btn" id="itemConvertBtn">Convert</button>
          <div class="muted">Output in grams</div>
        </div>

const V={'¼':.25,'½':.5,'¾':.75,'⅐':1/7,'⅑':1/9,'⅒':.1,'⅓':1/3,'⅔':2/3,'⅕':.2,'⅖':.4,'⅗':.6,'⅘':.8,'⅙':1/6,'⅚':5/6,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
function parseAmount(r){
  if(!r) return NaN;
  let s=r.trim();
  for(const k in V) if(s.includes(k)) s=s.replaceAll(k,' '+V[k]);
  let t=0;
  for(const p of s.split(/\s+/)){
    if(/^[-+]?\d+(?:[.,]\d+)?$/.test(p)) t+=parseFloat(p.replace(',', '.'));
    else if(/^[-+]?\d+\s*\/\s*\d+$/.test(p)){const[a,b]=p.split('/').map(Number); if(b) t+=a/b;}
    else return NaN;
  }
  return t;
}

}

const ITEMS=Object.keys(DATA).sort((a,b)=>a.localeCompare(b));
function renderList(q=''){
  sug.innerHTML='';
  const needle=q.trim().toLowerCase();
  let shown=0;
  for(const name of ITEMS){
    if(needle && !name.toLowerCase().includes(needle)) continue;
    const d=document.createElement('div');
    d.className='item';
    d.textContent=name;
    d.onclick=()=>{ing.value=name;hideList();};
    sug.appendChild(d);
    shown++;
    if(shown>=200) break;
  }
  sug.classList.toggle('show',shown>0);
  ing.setAttribute('aria-expanded',shown>0)
}
function showList(){renderList(ing.value);}
function hideList(){sug.classList.remove('show');ing.setAttribute('aria-expanded','false')}
ing.addEventListener('input',()=>showList());
ing.addEventListener('focus',()=>showList());
ing.addEventListener('blur',()=>setTimeout(hideList,150));

function findIngredient(name){
  if(DATA[name]) return name;
  const low=name.toLowerCase();
  const hit=ITEMS.find(k=>k.toLowerCase()===low)||ITEMS.find(k=>k.toLowerCase().startsWith(low));
  return hit||'';
}
function parseUnit(){return unit.value||''}
function conv(){
  let n=findIngredient(ing.value||'');
  const a=parseAmount(amt.value),u=parseUnit();
  if(!n||!u||!isFinite(a)){
    out.textContent='—';
    notes.textContent='Pick an ingredient, a unit, and enter a valid amount.';
    return;
  }
  const meta=U[u];
  let g;
  if(meta.k==='wt'){ g=meta.toG(a); }
  else { const cups=a*meta.toCups; g=cups*DATA[n]; }
  out.textContent=`${Math.round(g)} g`;
  notes.textContent=`${a} ${u} ${n} ≈ ${Math.round(g)} g`;
}
convertBtn.onclick=conv;
amt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();conv();}});

const ITEM_NAMES = Object.keys(ITEM_WEIGHTS).sort((a,b)=>a.localeCompare(b));
function renderList2(q=''){
  sug2.innerHTML='';
  const needle=q.trim().toLowerCase();
  let shown=0;
  for(const name of ITEM_NAMES){
    if(needle && !name.toLowerCase().includes(needle)) continue;
    const d=document.createElement('div');
    d.className='item';
    d.textContent=name;
    d.onclick=()=>{itemIng.value=name;hideList2();};
    sug2.appendChild(d);
    shown++;
    if(shown>=200) break;
  }
  sug2.classList.toggle('show',shown>0);
  itemIng.setAttribute('aria-expanded',shown>0)
}
function showList2(){renderList2(itemIng.value);}
function hideList2(){sug2.classList.remove('show');itemIng.setAttribute('aria-expanded','false')}
itemIng.addEventListener('input',()=>showList2());
itemIng.addEventListener('focus',()=>showList2());
itemIng.addEventListener('blur',()=>setTimeout(hideList2,150));

function findItem(name){
  if(ITEM_WEIGHTS[name]) return name;
  const low=name.toLowerCase();
  const hit=ITEM_NAMES.find(k=>k.toLowerCase()===low)||ITEM_NAMES.find(k=>k.toLowerCase().startsWith(low));
  return hit||'';
}
function convItem(){
  let n=findItem(itemIng.value||'');
  const q=parseFloat(String(qty.value).replace(',','.'));
  if(!n||!isFinite(q)){
    itemOut.textContent='—';
    itemNotes.textContent='Pick an item and enter a valid quantity.';
    return;
  }
  const grams = Math.round(ITEM_WEIGHTS[n] * q);
  itemOut.textContent = `${grams} g`;
  itemNotes.textContent = `${q} × ${n} ≈ ${grams} g`;
}
itemConvertBtn.onclick=convItem;
qty.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();convItem();}});
</script>
